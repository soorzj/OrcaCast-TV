<!doctype html>
<meta charset="utf-8"><title>OrcaCast TV</title>
<style>
*{box-sizing:border-box;margin:0}
body{overflow:hidden;background:#05070d;color:#fff;font-family:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;cursor:none;user-select:none}
svg{width:1em;height:1em}
#wall{position:fixed;inset:-6%;background:radial-gradient(60% 50% at 15% 20%,#3b4fd9aa,transparent),radial-gradient(50% 60% at 85% 80%,#a02bd8aa,transparent),radial-gradient(40% 40% at 70% 15%,#0ea5b7aa,transparent),#070b16;background-size:cover;background-position:center;animation:kb 45s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.1) translate(-1.5%,-1%)}}
#shade{position:fixed;inset:0;background:linear-gradient(#000c,#0000 26%,#0000 40%,#000e)}
.glass{background:#ffffff1a;backdrop-filter:blur(24px) saturate(1.4);border:1px solid #ffffff22}
kbd{display:inline-block;min-width:34px;text-align:center;padding:3px 10px;border-radius:8px;background:#ffffff22;border:1px solid #fff3;border-bottom-width:3px;font:600 15px 'Segoe UI',sans-serif}
#brand{position:fixed;top:34px;left:64px;display:flex;align-items:center;gap:16px;font-weight:600;letter-spacing:7px;font-size:21px}
.lg{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#7c5cff);display:grid;place-items:center;font-size:28px;box-shadow:0 8px 30px #4f6bff77}
#acts{position:fixed;top:112px;left:64px;display:flex;gap:14px}
.act{display:flex;gap:10px;align-items:center;padding:12px 24px;border-radius:99px;font-size:19px;background:#ffffff1a;backdrop-filter:blur(24px);border:1px solid #ffffff22;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.act svg{font-size:23px}.act.on{background:#fff;color:#111;transform:scale(1.08);box-shadow:0 10px 40px #0008}
#top{position:fixed;top:30px;right:64px;display:flex;align-items:center;gap:26px;text-shadow:0 2px 16px #0009}
#wxb{display:flex;align-items:center;gap:14px}#wxi{font-size:60px;filter:drop-shadow(0 4px 14px #0009)}
#wxt{font-size:52px;font-weight:300;line-height:1}#wxs{font-size:16px;opacity:.85;line-height:1.35;margin-top:4px}
.vr{width:1px;height:78px;background:#ffffff40}
#time{font-size:76px;font-weight:200;line-height:1;letter-spacing:-2px;white-space:nowrap}#date{font-size:21px;opacity:.85;margin-top:6px;text-align:right}
#status{position:fixed;top:146px;right:68px;display:flex;gap:18px;font-size:25px;opacity:.9}#status .dim{opacity:.25}
#greet{position:fixed;left:68px;top:36%}#greet h1{font-size:68px;font-weight:200;letter-spacing:-1px}#greet p{font-size:24px;opacity:.7;margin-top:6px}
#rowwrap{position:fixed;left:0;right:0;bottom:118px}#rt{margin:0 0 22px 68px;font-size:15px;letter-spacing:4px;text-transform:uppercase;opacity:.55}
#row{display:flex;gap:34px;width:max-content;position:relative;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.card{width:320px;flex:none}
.tile{position:relative;width:320px;height:180px;border-radius:22px;background:linear-gradient(145deg,var(--c),#000b) center/cover;display:grid;place-items:center;opacity:.7;filter:saturate(.85);transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s,box-shadow .3s,filter .3s;overflow:hidden}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff2e 48%,transparent 66%);transform:translateX(-130%)}
.card.on .tile::after{animation:sh 2.6s 0.4s infinite}@keyframes sh{to{transform:translateX(130%)}}
.tile em{position:absolute;font-style:normal;font-size:130px;font-weight:700;opacity:.14;right:18px;bottom:-26px}
.tile .ico{font-size:76px;z-index:1;filter:drop-shadow(0 6px 18px #0009)}
.tile img{width:76px;height:76px;border-radius:18px;background:#fff;padding:8px;box-shadow:0 8px 30px #0007;z-index:1}
.tile.add{background:#ffffff12;border:2px dashed #fff5}.tile.add svg{font-size:56px;opacity:.8}
.badge{position:absolute;top:14px;left:14px;font-size:13px;letter-spacing:2px;padding:5px 12px;border-radius:99px;background:#000a;z-index:2;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.5}}
.card p{margin:16px 0 0 6px;font-size:23px;opacity:0;transform:translateY(-6px);transition:.3s}
.card.on .tile{opacity:1;filter:none;transform:scale(1.13) translateY(-8px);box-shadow:0 0 0 4px #fff,0 30px 80px color-mix(in srgb,var(--c) 70%,transparent)}
.card.on p{opacity:1;transform:none;margin-top:30px}
#legend{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:26px;padding:10px 28px;border-radius:99px;font-size:16px;opacity:.85;white-space:nowrap}
#legend span{display:flex;gap:9px;align-items:center}
#set,#srch{position:fixed;inset:0;background:#05070dd9;backdrop-filter:blur(30px);display:none;align-items:center;justify-content:center;z-index:30}
#set.show,#srch.show{display:flex;animation:f .35s}@keyframes f{from{opacity:0;transform:scale(1.02)}}
.panel{width:min(1200px,90vw);height:84vh;border-radius:32px;padding:28px 40px;display:flex;flex-direction:column;background:#0b1020ee;border:1px solid #ffffff22;box-shadow:0 40px 120px #000a}
.hd{display:flex;align-items:center;gap:34px;margin-bottom:10px}.hd h2{font-size:30px;font-weight:300}
#tabs{display:flex;gap:10px}.tab{padding:11px 22px;border-radius:99px;font-size:19px;opacity:.55;transition:.2s}.tab.cur{opacity:1;background:#ffffff1e}.tab.on{background:#fff;color:#111;opacity:1;transform:scale(1.06)}
#list{flex:1;overflow:hidden;position:relative;padding:4px 10px}
h5{font-size:13px;letter-spacing:3px;text-transform:uppercase;opacity:.5;margin:20px 0 8px}
.it,#list input{display:block;width:100%;padding:14px 22px;border-radius:14px;font-size:21px;margin:6px 0;background:#ffffff12;border:2px solid transparent;color:#fff;transition:.2s;outline:0;font-family:inherit}
.it.on,#list input.on{background:#ffffff30;border-color:#fff;transform:translateX(8px)}#list input:focus{background:#fff;color:#111}
.sw{display:inline-block;width:52px;height:28px;border-radius:8px;margin-right:16px;vertical-align:middle;border:1px solid #fff5}
.kr{display:inline-flex;align-items:center;gap:16px;width:49%;padding:9px 4px;font-size:20px;vertical-align:top}.kr kbd{min-width:90px}
.note{opacity:.55;font-size:16px;margin-top:14px;line-height:1.5}
.pair{display:flex;gap:34px;align-items:center;padding:10px 4px 6px}.pair img{width:190px;border-radius:16px}.pinv{font-size:48px;font-weight:300;letter-spacing:12px;margin:6px 0}.urls{opacity:.7;font-size:17px;line-height:1.6}
#srch{flex-direction:column;gap:18px;text-align:center}#srch .mic{font-size:110px;padding:36px;border-radius:50%;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 36px #ffffff10}}#srch p{font-size:26px;opacity:.9}#srch small{font-size:18px;opacity:.6}
#lock{position:fixed;inset:0;z-index:50;background:#0006;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transform:scale(1.03);transition:opacity .7s,transform .7s}
#lock.show{opacity:1;pointer-events:auto;transform:none}
#lt{position:absolute;left:80px;bottom:170px;font-size:190px;font-weight:200;letter-spacing:-6px;line-height:1;text-shadow:0 4px 40px #0008}
#ld{position:absolute;left:90px;bottom:120px;font-size:30px;opacity:.9}#lw{position:absolute;left:90px;bottom:72px;font-size:22px;opacity:.8}
#unl{position:absolute;right:80px;bottom:76px;font-size:21px;opacity:.75;animation:br 2.4s infinite}@keyframes br{50%{opacity:.25}}
#lbrand{position:absolute;left:90px;top:60px}
#off{position:fixed;inset:0;background:#000;z-index:90;display:none}#off.show{display:block}
#offc{position:absolute;font-size:44px;font-weight:200;color:#ffffff12;letter-spacing:2px;transition:none}
body.off *{animation:none!important}body.off #wall{display:none}
#toast{position:fixed;left:50%;top:40px;transform:translate(-50%,-120px);padding:14px 28px;border-radius:99px;font-size:21px;z-index:60;transition:transform .5s cubic-bezier(.2,.8,.2,1)}#toast.show{transform:translate(-50%,0)}
#splash{position:fixed;inset:0;background:#05070d;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .8s}#splash.out{opacity:0;pointer-events:none}
#logo{width:128px;height:128px;border-radius:36px;font-size:80px;animation:pop 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 90px #5b7bff99}
#splash h1{font-size:38px;font-weight:300;letter-spacing:14px;animation:rise 1.2s .3s both}#splash h1 b{font-weight:700}
#bar{width:220px;height:3px;background:#ffffff1a;border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#a855f7);animation:ld 2s ease-out forwards}
@keyframes pop{from{transform:scale(.4);opacity:0;filter:blur(20px)}}@keyframes rise{from{opacity:0;transform:translateY(14px);letter-spacing:2px}}@keyframes ld{from{width:0}to{width:100%}}
</style>
<div id="wall"></div><div id="shade"></div>
<div id="brand"><div class="lg" id="lg1"></div>ORCACAST TV</div>
<div id="acts"></div>
<div id="top"><div id="wxb"><div id="wxi"></div><div><div id="wxt"></div><div id="wxs"></div></div></div><div class="vr"></div><div><div id="time"></div><div id="date"></div></div></div>
<div id="status"></div>
<div id="greet"><h1 id="gh"></h1><p>What would you like to watch?</p></div>
<div id="rowwrap"><div id="rt">Apps</div><div id="row"></div></div>
<div id="legend" class="glass"><span><kbd>OK</kbd>Select</span><span><kbd>Esc</kbd>Back</span><span><kbd>Hold Esc</kbd>Exit app</span><span><kbd>Home</kbd>Home</span><span><kbd>=</kbd>Settings</span><span><kbd>]</kbd>Lock</span><span><kbd>/</kbd>Power</span></div>
<div id="srch"><div class="mic glass" id="micic"></div><p>Press <kbd>\</kbd> to speak into the PC microphone</p><small>Say “open Netflix” or “search lo-fi beats” · or use the Type tab on your phone remote</small></div>
<div id="set"><div class="panel"><div class="hd"><h2>Settings</h2><div id="tabs"></div></div><div id="list"></div></div></div>
<div id="lock"><div id="lbrand" class="lg" style="width:56px;height:56px"></div><div id="lt"></div><div id="ld"></div><div id="lw"></div><div id="unl">Press OK to unlock</div></div>
<div id="off"><div id="offc"></div></div>
<div id="toast" class="glass"></div>
<div id="splash"><div id="logo" class="lg"></div><h1><b>ORCA</b>CAST TV</h1><div id="bar"><i></i></div></div>
<script>
const { ipcRenderer: ipc } = require('electron');
const $ = s => document.querySelector(s);
const I = { search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>', plus: '<path d="M12 5v14M5 12h14"/>', mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>', wifi: '<path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19.5" r="1"/>', phone: '<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>' };
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const ORCA = '<svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 21v-8M12 13C9 13 5 11 2.500 5.500c3 1.500 6 1.500 9.500 0 3.500 1.500 6.500 1.500 9.500 0C19 11 15 13 12 13z"/></svg>';
['#lg1', '#lbrand', '#logo'].forEach(s => $(s).innerHTML = ORCA); $('#micic').innerHTML = ic('mic');
const THEMES = [['Aurora', ''], ['Sunset', 'radial-gradient(60% 55% at 20% 85%,#ff7a3dcc,transparent),radial-gradient(60% 60% at 85% 15%,#c026d3cc,transparent),#1a0b2e'], ['Ocean', 'radial-gradient(60% 55% at 15% 20%,#0ea5e9cc,transparent),radial-gradient(60% 60% at 85% 85%,#14b8a6cc,transparent),#031b2e'],
  ['Forest', 'radial-gradient(60% 55% at 20% 20%,#22c55ecc,transparent),radial-gradient(60% 60% at 80% 85%,#0f766ecc,transparent),#04140c'], ['Midnight', 'radial-gradient(60% 55% at 20% 20%,#1d4ed8aa,transparent),radial-gradient(60% 60% at 85% 85%,#4338caaa,transparent),#02040a'],
  ['Rose', 'radial-gradient(60% 55% at 15% 25%,#f43f5ecc,transparent),radial-gradient(60% 60% at 85% 80%,#fb923ccc,transparent),#1c0a14'], ['Ember', 'radial-gradient(60% 55% at 25% 80%,#ef4444cc,transparent),radial-gradient(60% 60% at 80% 20%,#f59e0bcc,transparent),#1a0a05'], ['Mono', 'radial-gradient(60% 55% at 20% 20%,#64748baa,transparent),radial-gradient(60% 60% at 85% 85%,#334155aa,transparent),#05070d']];
const SC = [['Esc', 'Back'], ['Hold Esc', 'Exit app → home screen'], ['Home', 'Home (app keeps running)'], ['Hold Home', 'Exit app → home screen'], ['+', 'Volume up'], ['−', 'Volume down'], ['*', 'Mute / unmute'], ['/', 'Power off / on'],
  ['=', 'Open settings'], [']', 'Lock / unlock'], ['Page Up', 'Play'], ['Page Down', 'Pause'], ['End', 'Stop'], ['<', 'Rewind 10 s'], ['>', 'Forward 10 s'], ['\\', 'Voice input (PC mic)']];
const TABS = ['Apps', 'Wallpaper', 'Phone remote', 'Shortcuts', 'System'];
let apps = [], run = null, row = 1, c0 = 0, c1 = 0, mode = 'home', locked = true, s = -1, tab = 0, phones = 0, idle = 0, lockSecs = 0, inApp = false, login = false, ytShadow = true, theme = 0, hasWall = false, pair = { urls: [], pin: '', qr: '' }, off = false;
let draft = { name: '', url: '', thumb: '', wall: '' };
const host = u => { try { return new URL(u).hostname; } catch { return ''; } };
const hue = n => [...n].reduce((a, c) => a + c.charCodeAt(0) * 7, 0) % 360;
const col = a => a.color || `hsl(${hue(a.name)} 55% 30%)`;
const list = () => [...(run ? [{ resume: 1, name: run.name, url: '' }] : []), ...apps];
const fav = a => a.icon ? `<span class="ico">${a.icon}</span>` : `<img src="https://www.google.com/s2/favicons?domain=${host(a.url)}&sz=128" onerror="this.remove()">`;

function render() {
  $('#acts').innerHTML = [['search', 'Search'], ['gear', 'Settings'], ['lock', 'Lock']].map(([n, l]) => `<div class="act">${ic(n)}<span>${l}</span></div>`).join('');
  const L = list();
  $('#row').innerHTML = L.map(a => a.resume
    ? `<div class="card"><div class="tile" style="--c:#2563eb"><span class="badge">● RUNNING</span>${(apps.find(x => x.name === a.name) ? fav(apps.find(x => x.name === a.name)) : '<em>▶</em>')}</div><p>Resume ${a.name}</p></div>`
    : `<div class="card"><div class="tile" style="--c:${col(a)};${a.thumb ? `background-image:url('${a.thumb}')` : ''}">${a.thumb ? '' : `<em>${a.name[0]}</em>${fav(a)}`}</div><p>${a.name}</p></div>`).join('')
    + `<div class="card"><div class="tile add">${ic('plus')}</div><p>Add app</p></div>`;
  c1 = Math.min(c1, L.length); focus();
}
function focus() {
  document.querySelectorAll('.act').forEach((e, n) => e.classList.toggle('on', row === 0 && n === c0));
  const t = [...document.querySelectorAll('.card')];
  t.forEach((e, n) => e.classList.toggle('on', row === 1 && n === c1));
  const e = t[c1]; if (e) $('#row').style.transform = `translateX(${innerWidth / 2 - 160 - e.offsetLeft}px)`;
}
function status() { $('#status').innerHTML = `<span class="${navigator.onLine ? '' : 'dim'}" title="Network">${ic('wifi')}</span><span class="${phones ? '' : 'dim'}" title="Phone remote">${ic('phone')}</span>`; }

const pairHtml = () => `<div class="pair"><img src="${pair.qr}"><div><div style="font-size:19px;opacity:.8">Scan with your phone camera · same Wi-Fi</div><div class="pinv">${pair.pin}</div><div class="urls">${pair.urls.join('<br>')}</div></div></div>`;
const items = () => {
  const T = TABS[tab];
  if (T === 'Apps') return [{ h: 'Add app' }, { in: 'name', p: 'App name' }, { in: 'url', p: 'Website, e.g. hotstar.com' }, { in: 'thumb', p: 'Thumbnail image URL (optional)' }, { l: '＋  Save app', f: saveApp }, { h: 'Your apps' }, ...apps.map((a, n) => ({ l: 'Remove  ' + a.name, f: () => ipc.send('rmapp', n) }))];
  if (T === 'Wallpaper') return [{ h: 'Themes' }, ...THEMES.map(([n, g], i) => ({ l: (!hasWall && theme === i ? '✓  ' : '') + n, sw: g || 'linear-gradient(135deg,#3b4fd9,#a02bd8)', f: () => ipc.send('theme', i) })),
    { h: 'Photos' }, { l: '🎲  Random photo', f: () => ipc.send('randwall') }, { l: '📁  Choose image from this PC…', f: () => ipc.send('pickwall') }, { in: 'wall', p: 'Image URL' }, { h: 'Tip' }, { html: '<p class="note">You can also upload a wallpaper from your phone: Remote → Apps tab → Upload.</p>' }];
  if (T === 'Phone remote') return [{ html: pairHtml() }, { l: '🛡  Fix phone connection (firewall)', f: () => ipc.send('fixfw') }];
  if (T === 'Shortcuts') return [...SC.map(([k, d]) => ({ k, d })), { html: '<p class="note">Symbol keys (+ − * / = ] &lt; &gt; \\) are ignored while you are typing in a text box. Esc and Home always work.</p>' }];
  return [{ l: 'Start with Windows:  ' + (login ? 'On' : 'Off'), f: () => ipc.send('login', !login) }, { l: 'YouTube text shadow fix:  ' + (ytShadow ? 'On' : 'Off') + '   (reopen YouTube to apply)', f: () => ipc.send('ytshadow', !ytShadow) }, { l: 'Open extensions folder', f: () => ipc.send('extdir') }, { l: '📄  Open log folder (for support)', f: () => ipc.send('openlog') }, { l: '⏻  Power off', f: () => ipc.send('poweroff') }, { html: '<p class="note">OrcaCast TV v1.2</p>' }];
};
const foc = () => items().filter(x => x.l || x.in);
function drawSet() {
  $('#tabs').innerHTML = TABS.map((t, n) => `<div class="tab ${n === tab ? 'cur' : ''} ${s < 0 && n === tab ? 'on' : ''}">${t}</div>`).join('');
  let n = 0;
  $('#list').innerHTML = items().map(x => x.h ? `<h5>${x.h}</h5>` : x.html ? x.html : x.k ? `<div class="kr"><kbd>${x.k}</kbd><span>${x.d}</span></div>`
    : x.in ? `<input data-k="${x.in}" placeholder="${x.p}" value="${draft[x.in] || ''}" class="${n++ === s ? 'on' : ''}">`
    : `<div class="it ${n++ === s ? 'on' : ''}">${x.sw ? `<i class="sw" style="background:${x.sw}"></i>` : ''}${x.l}</div>`).join('');
  const on = $('#list .on'); if (on) $('#list').scrollTo({ top: on.offsetTop - 220, behavior: 'smooth' });
}
$('#list').addEventListener('change', e => { const k = e.target.dataset.k; draft[k] = e.target.value; if (k === 'wall') ipc.send('wallurl', draft.wall); });
function saveApp() { if (draft.name && draft.url) { ipc.send('addapp', draft); draft = { name: '', url: '', thumb: '', wall: draft.wall }; s = 0; drawSet(); } else toast('Enter a name and website'); }
function openSet() { mode = 'set'; s = -1; $('#set').classList.add('show'); drawSet(); }
function closeSet() { mode = 'home'; $('#set').classList.remove('show'); $('#srch').classList.remove('show'); }
function lock() { locked = true; lockSecs = 0; closeSet(); $('#lock').classList.add('show'); ipc.send('lockstate', true); }
function unlock() { locked = false; idle = 0; lockSecs = 0; $('#lock').classList.remove('show'); ipc.send('lockstate', false); }
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e.t); e.t = setTimeout(() => e.classList.remove('show'), 2600); }

function nav(k) {
  idle = 0;
  if (off) return;
  if (locked) return unlock();
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT') { if (k === 'ok' || k === 'back') { ae.blur(); return; } if (k === 'up' || k === 'down') ae.blur(); else return; }
  if (k === 'lock') return lock();
  if (k === 'settings') return mode === 'set' ? closeSet() : openSet();
  if (mode === 'home') {
    const nA = list().length;
    if (k === 'left') row ? c1 = Math.max(0, c1 - 1) : c0 = Math.max(0, c0 - 1);
    else if (k === 'right') row ? c1 = Math.min(nA, c1 + 1) : c0 = Math.min(2, c0 + 1);
    else if (k === 'up') row = 0; else if (k === 'down') row = 1;
    else if (k === 'ok') {
      if (row === 0) return [() => { mode = 'srch'; $('#srch').classList.add('show'); }, openSet, lock][c0]();
      const a = list()[c1]; if (!a) { tab = 0; return openSet(); }
      return a.resume ? ipc.send('resume') : ipc.send('launch', a.url);
    }
    focus();
  } else if (mode === 'srch') { if (k === 'back' || k === 'home' || k === 'ok') closeSet(); }
  else {
    const F = foc();
    if (k === 'left' || k === 'right') { if (s < 0) tab = Math.max(0, Math.min(TABS.length - 1, tab + (k === 'left' ? -1 : 1))); }
    else if (k === 'up') { if (F.length) s = Math.max(-1, s - 1); else $('#list').scrollBy({ top: -300, behavior: 'smooth' }); }
    else if (k === 'down') { if (F.length) s = Math.min(F.length - 1, s + 1); else $('#list').scrollBy({ top: 300, behavior: 'smooth' }); }
    else if (k === 'back') { if (s >= 0) s = -1; else return closeSet(); }
    else if (k === 'home') return closeSet();
    else if (k === 'ok') { if (s < 0) { if (F.length) s = 0; } else { const x = F[s]; if (x.in) { $('#list .on').focus(); return; } x.f(); s = Math.min(s, foc().length - 1); } }
